name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  # Declaring any permission resets the rest to `none`; without `contents: read`
  # actions/checkout cannot clone a private repository (it reports the repo as
  # "not found" instead of an auth error).
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    # Uploading results needs code scanning, which private repositories only get
    # with GitHub Advanced Security. Without it the scan itself succeeds and the
    # upload fails with "Resource not accessible by integration", leaving a check
    # that can never pass. Public forks keep scanning; a private deployment with
    # GHAS can opt in by setting the CODEQL_ENABLED repository variable.
    if: ${{ github.event.repository.private == false || vars.CODEQL_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

